services:
  grafana:
    image: grafana/grafana:12.4.2
    ports:
      - "3000:3000"
    environment:
      GF_DEFAULT_APP_MODE: development
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: asim-device-action-app,asim-device-action-panel
    volumes:
      - ./dist:/var/lib/grafana/plugins/asim-device-action-app
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      mock-api:
        condition: service_healthy
  mock-api:
    build:
      context: ./test/mock-api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
