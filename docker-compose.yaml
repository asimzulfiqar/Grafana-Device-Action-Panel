services:
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.4.2}
    ports:
      - "3000:3000"
    environment:
      GF_DEFAULT_APP_MODE: development
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: asim-deviceaction-app,asim-deviceaction-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dist:/var/lib/grafana/plugins/asim-deviceaction-app
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./provisioning/plugins:/etc/grafana/provisioning/plugins
    depends_on:
      mock-api:
        condition: service_healthy
  mock-api:
    build:
      context: ./test/mock-api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  grafana-data:
